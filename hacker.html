<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>I LOVE YOU BABY ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #070108;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #matrix-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        circle at center,
        rgba(15, 2, 14, 0.2) 0%,
        rgba(7, 1, 8, 0.6) 65%,
        rgba(4, 0, 5, 0.94) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .center-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
      user-select: none;
      padding: 20px;
    }

    .matrix-word {
      margin: 0;
      padding: 0;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: clamp(6px, 2.5vw, 22px);
      color: #ffffff;
      text-align: center;
      line-height: 1;
      will-change: transform, opacity;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow:
        0 0 10px #ffffff,
        0 0 20px #ff758f,
        0 0 40px #ff0055,
        0 0 75px #ff2a75,
        0 0 110px #d90368;
    }

    .matrix-word.visible {
      opacity: 1;
      transform: scale(1);
      animation: neonPulse 2.2s ease-in-out infinite alternate;
    }

    .matrix-word.fade-out {
      opacity: 0;
      transform: scale(1.1);
      transition: opacity 0.38s cubic-bezier(0.7, 0, 0.84, 0), transform 0.38s cubic-bezier(0.7, 0, 0.84, 0);
    }

    .matrix-word.word-baby {
      text-shadow:
        0 0 12px #ffffff,
        0 0 24px #ffffff,
        0 0 45px #ff758f,
        0 0 80px #ff0055,
        0 0 120px #ff2a75,
        0 0 180px #d90368;
      animation: babyPulse 2s ease-in-out infinite alternate;
    }

    @keyframes neonPulse {
      0% {
        text-shadow:
          0 0 10px #ffffff,
          0 0 20px #ff758f,
          0 0 40px #ff0055,
          0 0 75px #ff2a75,
          0 0 110px #d90368;
        transform: scale(1);
      }
      100% {
        text-shadow:
          0 0 14px #ffffff,
          0 0 28px #ff758f,
          0 0 55px #ff0055,
          0 0 95px #ff2a75,
          0 0 140px #d90368,
          0 0 190px #800f2f;
        transform: scale(1.03);
      }
    }

    @keyframes babyPulse {
      0% {
        text-shadow:
          0 0 12px #ffffff,
          0 0 24px #ffffff,
          0 0 45px #ff758f,
          0 0 80px #ff0055,
          0 0 120px #ff2a75,
          0 0 180px #d90368;
        transform: scale(1);
      }
      100% {
        text-shadow:
          0 0 18px #ffffff,
          0 0 32px #ffffff,
          0 0 65px #ff758f,
          0 0 110px #ff0055,
          0 0 160px #ff2a75,
          0 0 220px #d90368;
        transform: scale(1.05);
      }
    }

    /* Subtle Floating Music Control */
    .music-pill {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      background: rgba(20, 2, 16, 0.65);
      border: 1px solid rgba(255, 117, 143, 0.4);
      border-radius: 30px;
      padding: 8px 16px;
      color: #ff8fa3;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .music-pill:hover {
      background: rgba(40, 4, 30, 0.85);
      border-color: #ff4d6d;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Continuous Vertical Matrix Rain Canvas -->
  <canvas id="matrix-canvas"></canvas>
  <div class="vignette-overlay"></div>

  <!-- Music Pill -->
  <button id="music-pill" class="music-pill" title="Toggle Music">
    <span>🎵</span>
    <span id="music-text">Cinnamon Girl</span>
  </button>

  <audio id="bg-audio" loop preload="auto">
    <source src="assets/audio/cinnamon-girl.mp3" type="audio/mpeg">
    <source src="assets/cinnamon-girl.mp3" type="audio/mpeg">
    <source src="cinnamon-girl.mp3" type="audio/mpeg">
  </audio>

  <!-- Center Sequential Text -->
  <div class="center-container">
    <h1 id="matrix-word" class="matrix-word">I</h1>
  </div>

  <script>
    (function() {
      'use strict';

      // ---------------- Canvas Vertical Falling Matrix Code ----------------
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');
      const wordEl = document.getElementById('matrix-word');
      const audioEl = document.getElementById('bg-audio');
      const musicBtn = document.getElementById('music-pill');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();

      const charList = 'ILOVEYOUBABYMANMONYHAPPYBIRTHDAY5122006♥❤✦✧'.split('');
      const fontSize = window.innerWidth < 600 ? 14 : 17;
      let cols = Math.floor(canvas.width / fontSize);
      let drops = [];

      function initDrops() {
        cols = Math.floor(canvas.width / fontSize);
        drops = [];
        for (let i = 0; i < cols; i++) {
          drops.push({
            y: Math.random() * -100,
            speed: Math.random() * 0.8 + 0.8, // Graceful smooth falling speed
            length: Math.floor(Math.random() * 14) + 10,
            headChar: charList[Math.floor(Math.random() * charList.length)]
          });
        }
      }
      initDrops();

      window.addEventListener('resize', () => {
        resize();
        initDrops();
      });

      function drawMatrix() {
        // Dark translucent trail overlay
        ctx.fillStyle = 'rgba(7, 1, 8, 0.14)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = `bold ${fontSize}px monospace`;

        for (let i = 0; i < drops.length; i++) {
          const drop = drops[i];
          const x = i * fontSize;
          const currentY = Math.floor(drop.y) * fontSize;

          if (Math.random() > 0.92) {
            drop.headChar = charList[Math.floor(Math.random() * charList.length)];
          }

          // Glowing white/pink head
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ff2a75';
          ctx.shadowBlur = 10;
          ctx.fillText(drop.headChar, x, currentY);

          // Body of the stream (vibrant pink & magenta)
          ctx.shadowColor = '#ff0055';
          ctx.shadowBlur = 6;
          for (let t = 1; t <= drop.length; t++) {
            const trailY = currentY - t * fontSize;
            if (trailY > 0 && trailY < canvas.height) {
              const alpha = 1 - t / drop.length;
              if (t <= 3) {
                ctx.fillStyle = `rgba(255, 42, 117, ${alpha})`;
              } else if (t <= 8) {
                ctx.fillStyle = `rgba(255, 117, 143, ${alpha * 0.9})`;
              } else {
                ctx.fillStyle = `rgba(180, 15, 65, ${alpha * 0.7})`;
              }
              const trailChar = charList[(i + t) % charList.length];
              ctx.fillText(trailChar, x, trailY);
            }
          }
          ctx.shadowBlur = 0;

          drop.y += drop.speed;

          if (drop.y * fontSize - drop.length * fontSize > canvas.height) {
            drop.y = Math.random() * -30;
            drop.speed = Math.random() * 0.8 + 0.8;
            drop.length = Math.floor(Math.random() * 14) + 10;
          }
        }

        requestAnimationFrame(drawMatrix);
      }
      requestAnimationFrame(drawMatrix);

      // ---------------- Word Sequence Animation ----------------
      const WORDS = [
        { text: 'I', size: 'clamp(5.5rem, 20vw, 12rem)', duration: 1500, isBaby: false },
        { text: 'LOVE', size: 'clamp(4.6rem, 18vw, 11rem)', duration: 1500, isBaby: false },
        { text: 'YOU', size: 'clamp(4.6rem, 18vw, 11rem)', duration: 1500, isBaby: false },
        { text: 'BABY', size: 'clamp(5.5rem, 21vw, 13rem)', duration: 3000, isBaby: true }
      ];

      let currentIdx = 0;

      function playNextWord() {
        const item = WORDS[currentIdx];

        wordEl.textContent = item.text;
        wordEl.style.fontSize = item.size;

        if (item.isBaby) {
          wordEl.classList.add('word-baby');
        } else {
          wordEl.classList.remove('word-baby');
        }

        // Scale-up & Fade-in
        wordEl.classList.remove('fade-out');
        void wordEl.offsetWidth;
        wordEl.classList.add('visible');

        setTimeout(() => {
          // Fade-out & Zoom-out
          wordEl.classList.remove('visible');
          wordEl.classList.add('fade-out');

          setTimeout(() => {
            wordEl.classList.remove('fade-out');
            currentIdx = (currentIdx + 1) % WORDS.length;
            playNextWord();
          }, 380);

        }, item.duration);
      }

      // Start sequence
      setTimeout(playNextWord, 400);

      // ---------------- Audio & Autoplay ----------------
      function startMusic() {
        audioEl.volume = 0.65;
        audioEl.play().catch(() => {});
      }

      window.addEventListener('click', startMusic, { once: true });
      window.addEventListener('touchstart', startMusic, { once: true });

      musicBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (audioEl.paused) {
          audioEl.play();
          musicBtn.style.opacity = '1';
        } else if (audioEl.muted) {
          audioEl.muted = false;
          musicBtn.style.opacity = '1';
        } else {
          audioEl.muted = true;
          musicBtn.style.opacity = '0.5';
        }
      });
    })();
  </script>
</body>
</html>
